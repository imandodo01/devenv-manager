[package]
name = "devenv-manager"
version = "0.1.0"
description = "A local developer-environment information and management center."
authors = ["DevEnv Manager contributors"]
edition = "2024"

[lib]
name = "devenv_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
